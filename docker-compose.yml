services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: kamonitor-root
      MYSQL_DATABASE: kamonitor
      MYSQL_USER: kamonitor
      MYSQL_PASSWORD: kamonitor
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      # The demo data (kamonitor_demo.sql.gz) is imported on the first start only.
      - ./db:/docker-entrypoint-initdb.d:ro
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ukamonitor", "-pkamonitor"]
      interval: 5s
      timeout: 5s
      retries: 60

  app:
    build: .
    environment:
      MYSQL_CRM_HOST: db
      MYSQL_CRM_DATABASE: kamonitor
      MYSQL_CRM_USERNAME: kamonitor
      MYSQL_CRM_PASSWORD: kamonitor
      # Optional: an OpenAI-compatible LLM endpoint enables the "Regenerate" buttons.
      # Set these in a .env file next to this compose file (see README).
      LLM_API_BASE: ${LLM_API_BASE:-}
      LLM_MODEL: ${LLM_MODEL:-}
    extra_hosts:
      # lets LLM_API_BASE point to a server on the Docker host: http://host.docker.internal:8000/v1
      - "host.docker.internal:host-gateway"
    ports:
      - "8111:8111"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
